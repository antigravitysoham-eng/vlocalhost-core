# Check the pinned dependency set for known vulnerabilities.
#
# Weekly matters more than per-push, and that is the reason this runs on a
# schedule at all: most CVEs appear in code nobody touched. A project that only
# audits on change will sit on a vulnerable pin for as long as nobody edits the
# file it is written in, which for a lock file is close to forever.
name: audit

on:
  schedule:
    # Mondays 07:00 UTC. GitHub's cron is best-effort; an hour's drift is fine,
    # a week's would not be, which is what workflow_dispatch is for.
    - cron: "0 7 * * 1"
  push:
    paths:
      - "requirements.txt"
      - "constraints.txt"
      - ".github/workflows/audit.yml"
  pull_request:
    paths:
      - "requirements.txt"
      - "constraints.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    # One runner per platform, because the dependency graph genuinely differs:
    # colorama is Windows-only, python-xlib Linux-only, and the pyobjc trio
    # macOS-only. A single-platform audit would silently never look at five of
    # the packages we ship.
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false        # one platform's advisory must not hide another's
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Match the interpreter the bundles ship, or the audit describes a
          # dependency graph no user actually has.
          python-version: "3.12"

      - name: Install pip-audit
        run: python -m pip install --disable-pip-version-check -q pip-audit

      - name: Audit the dependency tree
        # pip-audit has no -c/--constraint flag. An earlier version of this file
        # passed one; pip-audit read "constraints.txt" as a positional project
        # path and failed with "argument project_path: not allowed with -r".
        #
        # So the audit resolves requirements.txt in its own throwaway venv and
        # checks the whole resolved tree, transitive packages included. The nine
        # direct dependencies are pinned exactly, which bounds that resolution
        # tightly -- but it is worth being precise about the limit: pip-audit
        # resolves transitive packages itself rather than reading constraints.txt,
        # so what it checks can differ from the locked set by a patch version.
        # constraints.txt is what the *build* installs with; this is what CI can
        # verify without asking every runner to build every platform's packages.
        #
        # Matrixed because the trees genuinely differ -- colorama is Windows-only,
        # python-xlib Linux-only, the pyobjc trio macOS-only -- and a single
        # runner would never look at five of the packages we ship.
        #
        # --strict fails on an unfixable advisory too. Deliberate: the point is
        # to know, not to be reassured.
        run: python -m pip_audit --strict --progress-spinner=off -r requirements.txt

      - name: What to do if this failed
        if: failure()
        run: |
          echo "::notice::A pinned dependency has a known advisory on ${{ matrix.os }}."
          echo "Bump the pin in requirements.txt or constraints.txt, rebuild, then"
          echo "re-read the release SBOM so both files still agree with what ships."
          echo "If the advisory has no fix, say so in the release notes rather than"
          echo "pinning around it quietly."
