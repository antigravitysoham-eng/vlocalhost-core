# Build a self-contained bundle for every platform and attach it to a release.
#
# Native wheels cannot be cross-compiled, so each bundle is built on its own
# runner. `tools/build_bundle.py` refuses to run on the wrong host rather than
# quietly producing something that cannot start.
#
# Assets land on a DRAFT release. Nothing is public until a human opens the
# release and presses publish — see docs in the launch plan for the gate that
# has to pass first.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build the bundles but do not create a release"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  bundle:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    # A label with no runner behind it does not fail — it queues, for the full
    # 24-hour job limit, and takes the release job down with it when it finally
    # times out. That is how v1.1.0 and v1.1.1 lost their macOS builds. An hour
    # is well past the slowest honest build here, so this can only fire when
    # something is actually wrong.
    timeout-minutes: 60
    strategy:
      fail-fast: false        # one platform failing must not hide the others
      matrix:
        include:
          - target: windows-x64
            runner: windows-latest
          - target: macos-arm64
            runner: macos-14
          - target: macos-x64
            # Apple silicon cannot build x86_64 wheels, so the Intel bundle
            # needs a genuinely Intel runner. macos-13 was that runner until
            # GitHub retired the image; macos-15-intel is its replacement.
            runner: macos-15-intel
          - target: linux-x64
            # Oldest still-supported runner, for the widest glibc range: a
            # bundle built against a newer glibc will not start on an older
            # distribution, and the error names a symbol, not a cause.
            runner: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      # Only to run the build script itself — the bundle ships its own
      # interpreter and never uses this one.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libportaudio2 libasound2-dev

      - name: Build
        run: python tools/build_bundle.py --target ${{ matrix.target }} --out dist

      # The smoke test inside the build needs a display on Linux to call
      # tkinter.Tcl(); xvfb provides one. Windows and macOS runners have one.
      - name: Build (headless retry)
        if: runner.os == 'Linux' && failure()
        run: |
          sudo apt-get install -y xvfb
          xvfb-run -a python tools/build_bundle.py --target ${{ matrix.target }} --out dist

      # --- platform installers, built from the staged bundle ---------------
      - name: Windows installer (Inno Setup)
        if: matrix.target == 'windows-x64'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          # ${env:NAME}, not $env:NAME — the parentheses in "Program Files
          # (x86)" end the variable name, so the bare form expands to
          # $env:ProgramFiles followed by a literal "(x86)" and looks for
          # C:\Program Files(x86)\..., which does not exist.
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            /DAppVersion=$(python -c "import version; print(version.__version__)") `
            installer\windows\vlocalhost.iss

      # notarytool wants the App Store Connect key as a file on disk, so the
      # base64 secret has to be written out before the build can use it. Under
      # $RUNNER_TEMP it goes away with the runner. Without this step
      # AC_API_KEY_PATH is never set and the build silently skips notarizing,
      # however many of the other secrets are configured.
      - name: Stage the notarization key
        if: startsWith(matrix.target, 'macos')
        env:
          AC_API_KEY: ${{ secrets.AC_API_KEY }}
        run: |
          if [ -z "$AC_API_KEY" ]; then
            echo "No AC_API_KEY secret — this build will not be notarized."
            exit 0
          fi
          key="$RUNNER_TEMP/ac-api-key.p8"
          printf '%s' "$AC_API_KEY" | base64 --decode > "$key"
          chmod 600 "$key"
          echo "AC_API_KEY_PATH=$key" >> "$GITHUB_ENV"

      - name: macOS app + DMG
        if: startsWith(matrix.target, 'macos')
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          AC_API_ISSUER: ${{ secrets.AC_API_ISSUER }}
        run: python tools/build_macos_app.py --target ${{ matrix.target }}

      - name: Linux tarball
        if: matrix.target == 'linux-x64'
        run: |
          version=$(python -c "import version; print(version.__version__)")
          tar -C build/stage-linux-x64 -czf \
            "dist/vlocalhost-$version-linux-x64.tar.gz" .
          ls -lh dist

      - name: Verify checksum
        run: python tools/verify_bundle.py dist

      - uses: actions/upload-artifact@v4
        with:
          name: vlocalhost-${{ matrix.target }}
          # Vlocalhost.app is the staging tree the DMG was built from, not a
          # release asset. Uploading it as well means sending the whole bundle
          # twice, uncompressed, for nothing.
          path: |
            dist/*
            !dist/*.app
          retention-days: 14

  draft-release:
    name: draft release
    needs: bundle
    # `needs` alone means any one platform failing throws away the platforms
    # that succeeded — v1.1.1 built a working macOS DMG that nobody ever saw,
    # because Windows and the dead Intel runner failed alongside it. The draft
    # is human-gated, so a partial one is something to look at and decide on,
    # never something that ships by itself. "Check the platforms" below prints
    # what is missing so an incomplete draft cannot be mistaken for a full one.
    if: always() && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: staged

      - name: Collect assets
        run: |
          mkdir -p dist
          # Installers are the point of the release: the .dmg and .exe are what
          # the install page looks for by name, and globbing only *.zip left
          # both on the floor.
          find staged -type f \( -name '*.zip' -o -name '*.exe' \
            -o -name '*.dmg' -o -name '*.tar.gz' -o -name '*.sha256' \) \
            -exec cp {} dist/ \;
          cat dist/*.sha256 > dist/SHA256SUMS
          ls -lh dist

      - name: Check the platforms
        run: |
          missing=""
          for asset in windows-x64-setup.exe macos-arm64.dmg \
                       macos-x64.dmg linux-x64.tar.gz; do
            ls dist/*"$asset" >/dev/null 2>&1 || missing="$missing $asset"
          done
          if [ -n "$missing" ]; then
            echo "::warning::Draft is incomplete — no build for:$missing"
          else
            echo "All four platforms present."
          fi

      - name: Check the tag matches version.py
        run: |
          # python3, not python: this job has no setup-python step, and the
          # bare name is not guaranteed on the runner image. Until now the job
          # never reached this line, so the difference had never shown up.
          tag="${GITHUB_REF_NAME#v}"
          code="$(python3 -c 'import version; print(version.__version__)')"
          echo "tag=$tag  version.py=$code"
          test "$tag" = "$code" || {
            echo "::error::Tag $GITHUB_REF_NAME does not match version.py ($code)"
            exit 1
          }

      - name: Create the draft
        uses: softprops/action-gh-release@v2
        with:
          draft: true            # a human publishes it, never the pipeline
          generate_release_notes: true
          files: dist/*
