<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vlocalhost — call</title>
<!-- The offer that appears when a call starts, and the countdown when one ends.
     Drawn for exactly 372x148 CSS px (meeting_prompt.WIDTH/HEIGHT). It never
     takes focus -- the window is created with focus=False -- so every control
     here is a click target, and none depends on the keyboard. -->
<link rel="stylesheet" href="tokens.css">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    font: 400 13px/1.45 var(--f);
    color: var(--ink1);
    background: var(--panel-flat);
    -webkit-user-select: none; user-select: none;
    cursor: default;
  }
  /* A faint amber wash in the corner the mark sits in -- the aurora, at the
     size of a notification. Text never sits on it: it fades out by the title. */
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(160px 120px at 0% 0%, var(--amber-soft), transparent 70%);
  }
  .card { position: relative; height: 100%; box-sizing: border-box;
          padding: 16px 16px 0 16px; display: flex; flex-direction: column; }

  .head { display: flex; align-items: flex-start; gap: 12px; }
  .mark { flex: 0 0 auto; width: 34px; height: 34px; position: relative; }
  .mark svg { display: block; }
  /* The live dot: mint means "on this machine", the product's one meaning. */
  .mark .live { position: absolute; right: -3px; bottom: -3px; width: 12px; height: 12px;
                border-radius: 50%; background: var(--mint); box-shadow: 0 0 0 2.5px var(--panel-flat); }
  .mode-recording .mark .live, .mode-ended .mark .live { background: var(--risk); }
  .mode-recording .mark .live { animation: beat 1.4s ease-in-out infinite; }
  @keyframes beat { 50% { transform: scale(.72); opacity: .7; } }

  .words { flex: 1 1 auto; min-width: 0; }
  .title { font: 600 14.5px/1.3 var(--f); letter-spacing: -.005em;
           white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sub { color: var(--ink3); margin-top: 2px; white-space: nowrap;
         overflow: hidden; text-overflow: ellipsis; }
  .sub b { font-weight: 500; color: var(--ink2); }

  .x { flex: 0 0 auto; width: 26px; height: 26px; margin: -5px -6px 0 0;
       border: 0; border-radius: 8px; background: transparent; color: var(--ink3);
       font: 400 16px/1 var(--f); display: grid; place-items: center; }
  .x:hover { background: var(--btn); color: var(--ink1); }

  .row { display: flex; align-items: center; gap: 8px; margin-top: 14px; }
  button.b { height: 32px; padding: 0 14px; border-radius: 10px; border: 0;
             font: 600 13px/1 var(--f); display: inline-flex; align-items: center; gap: 8px; }
  .primary { background: var(--amber-grad); color: var(--amber-ink);
             box-shadow: inset 0 0 0 1px var(--amber-edge), 0 1px 2px rgba(0,0,0,.12); }
  .primary:hover { filter: brightness(1.05); }
  .primary:active { transform: translateY(1px); }
  .primary .rec { width: 8px; height: 8px; border-radius: 50%; background: #B3261E; }
  .ghost { background: var(--btn); color: var(--ink1); }
  .ghost:hover { background: var(--glass-strong); }
  .kbd { font: 500 11px/1 var(--m); color: var(--ink3); margin-left: auto;
         white-space: nowrap; }

  .foot { margin-top: auto; display: flex; align-items: center; height: 30px; }
  .link { border: 0; background: none; padding: 0; color: var(--ink3);
          font: 400 12px/1 var(--f); text-decoration: underline;
          text-decoration-color: var(--hair2); text-underline-offset: 3px; }
  .link:hover { color: var(--ink1); text-decoration-color: currentColor; }
  .private { margin-left: auto; font: 500 11px/1 var(--m); color: var(--mint-t);
             letter-spacing: .02em; }

  /* The time left, as a bar that drains. Paused while the pointer is on the
     card, because reading a sentence should not cost you the chance to act. */
  .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: var(--hair); }
  .bar i { display: block; height: 100%; width: 100%; background: var(--amber);
           transform-origin: left; }
  .mode-ended .bar i { background: var(--risk); }

  .in { animation: rise .28s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } }
  @media (prefers-reduced-motion: reduce) {
    .in, .mode-recording .mark .live { animation: none; }
  }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="card in" id="card">
  <div class="head">
    <div class="mark" aria-hidden="true">
      <svg width="34" height="34" viewBox="0 0 200 200">
        <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#CA8A04"/><stop offset="55%" stop-color="#EAB308"/>
        <stop offset="100%" stop-color="#FACC15"/></linearGradient></defs>
        <rect width="200" height="200" rx="44" fill="url(#g)"/>
        <g transform="translate(19.11 23.39) scale(0.7778)" fill="#fff">
        <rect x="23" y="44" width="22" height="36" rx="11"/>
        <rect x="54" y="79" width="22" height="42" rx="11"/>
        <rect x="85" y="114" width="22" height="48" rx="11"/>
        <rect x="116" y="79" width="22" height="42" rx="11"/>
        <circle cx="158" cy="62" r="27"/><path d="M 143 79 L 131 100 L 163 81 Z"/>
        </g>
      </svg>
      <span class="live"></span>
    </div>
    <div class="words">
      <div class="title" id="title">A call started</div>
      <div class="sub" id="sub">Take notes on this machine?</div>
    </div>
    <button class="x" id="x" title="Close" aria-label="Close">×</button>
  </div>

  <div class="row" id="row-offer">
    <button class="b primary" id="take"><span class="rec"></span>Take notes</button>
    <button class="b ghost" id="later">Not now</button>
    <span class="kbd" id="kbd" hidden></span>
  </div>
  <div class="row" id="row-ended" hidden>
    <button class="b primary" id="save">Save now</button>
    <button class="b ghost" id="keep">Keep recording</button>
  </div>

  <div class="foot">
    <button class="link" id="never">Don't ask for this app</button>
    <span class="private">● on-device</span>
  </div>
  <div class="bar" aria-hidden="true"><i id="bar"></i></div>
</div>

<script>
'use strict';
const $ = s => document.querySelector(s);
const api = () => window.pywebview.api;

/* One countdown, drawn by a transform the compositor animates, and paused by
   the pointer. `left` is the time remaining in ms; `onZero` is what happens. */
let left = 0, total = 1, last = 0, onZero = null, hovering = false, raf = 0;
function countdown(seconds, then) {
  total = left = seconds * 1000; onZero = then; last = performance.now();
  cancelAnimationFrame(raf); raf = requestAnimationFrame(step);
}
function step(now) {
  if (!hovering) left -= now - last;
  last = now;
  $('#bar').style.transform = `scaleX(${Math.max(0, left / total)})`;
  if (mode === 'ended') paintEnded();
  if (left <= 0) { const f = onZero; onZero = null; if (f) f(); return; }
  raf = requestAnimationFrame(step);
}
$('#card').addEventListener('mouseenter', () => (hovering = true));
$('#card').addEventListener('mouseleave', () => (hovering = false));

let mode = null, st = {};

function paint(s) {
  if (!s || !s.mode) return;          // made at startup, hidden: nothing to say
  st = s; mode = s.mode;
  // Replay the entrance each time the window reappears.
  const card = $('#card');
  card.classList.remove('in'); void card.offsetWidth; card.classList.add('in');
  document.body.className = 'mode-' + mode;
  if (s.appearance && s.appearance !== 'system') document.documentElement.dataset.appearance = s.appearance;
  else document.documentElement.removeAttribute('data-appearance');

  const offer = mode === 'offer';
  $('#row-offer').hidden = !offer;
  $('#row-ended').hidden = mode !== 'ended';
  $('#never').hidden = !offer;
  $('#never').textContent = `Don't ask for ${s.app || 'this app'}`;

  if (offer) {
    $('#title').textContent = titles(s)[0];
    $('#sub').innerHTML = 'Take notes? <b>Audio stays on this machine.</b>';
    const k = $('#kbd');
    k.hidden = !s.chord; k.textContent = s.chord || '';
    countdown(s.offer_seconds || 20, () => api().not_now());
  } else if (mode === 'ended') {
    $('#title').textContent = titles(s)[1];
    countdown(s.save_seconds || 20, () => api().save_now());
  }
}

/* "Google Meet call", when a browser's title names the service; "Zoom call"
   for a call app; and for anything else only what is certain -- an app we do
   not know has the microphone, which is not the same as a call. */
function titles(s) {
  if (s.kind === 'other') return [`${s.app} is using your microphone`,
                                  `${s.app} let go of the microphone`];
  const call = s.kind === 'browser'
    ? (s.service ? `${s.service} call` : `Call in ${s.app}`)
    : `${s.app} call`;
  return [`${call} started`, `${call} ended`];
}

function paintEnded() {
  const secs = Math.max(0, Math.ceil(left / 1000));
  $('#sub').textContent = hovering ? 'Paused while you read.'
                                   : `Saving your notes in ${secs}s`;
}

$('#take').addEventListener('click', async () => {
  cancelAnimationFrame(raf);
  document.body.className = 'mode-recording';
  $('#title').textContent = 'Taking notes';
  $('#sub').textContent = st.auto_stop ? 'Recording. It saves when the call ends.'
                                       : 'Recording. Stop it from the main window.';
  $('#row-offer').hidden = true; $('#never').hidden = true;
  $('#bar').style.transform = 'scaleX(1)';
  await api().take_notes();
  setTimeout(() => api().close(), 2400);
});
$('#later').addEventListener('click', () => api().not_now());
$('#never').addEventListener('click', () => api().never());
$('#save').addEventListener('click', () => api().save_now());
$('#keep').addEventListener('click', () => api().keep_recording());
$('#x').addEventListener('click', () => api().close());

window.addEventListener('vl', e => {
  if (e.detail.type === 'state') paint(e.detail.payload);
  else if (e.detail.type === 'hide') { cancelAnimationFrame(raf); onZero = null; }
});

/* Opened as a plain file there is no bridge: show the offer with sample words,
   so the design can be reviewed in a browser. `?mode=ended` shows the other.
   Appearance follows the system here, as it does in the app. */
window.addEventListener('pywebviewready', async () => paint(await api().state()));
if (!('pywebview' in window)) {
  setTimeout(() => {
    if (window.pywebview) return;
    const m = new URLSearchParams(location.search).get('mode') || 'offer';
    window.pywebview = { api: new Proxy({}, { get: () => async () => ({}) }) };
    paint({ mode: m, app: 'Chrome', label: 'Google Meet in Chrome', kind: 'browser',
            chord: 'Ctrl+Shift+Space', offer_seconds: 20, save_seconds: 20,
            appearance: 'system' });
  }, 400);
}
</script>
</body>
</html>
